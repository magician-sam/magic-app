name: Android test download

on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/android-release.yml'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Install Android SDK
        run: sdkmanager --install 'platforms;android-35' 'build-tools;35.0.0'
      - name: Build Android test app
        working-directory: android
        run: gradle --no-daemon --stacktrace assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Magic-by-Sam-Android-test
          path: android/app/build/outputs/apk/debug/app-debug.apk
      - name: Publish test download
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create android-v0.1.0 android/app/build/outputs/apk/debug/app-debug.apk \
            --target "$GITHUB_SHA" \
            --title 'Magic by Sam Android test 0.1.0' \
            --notes 'Test build for Android. Opens the live Magic by Sam website; internet access is required. This debug APK is not the Google Play release.'

